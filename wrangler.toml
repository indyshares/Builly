#:schema node_modules/wrangler/config-schema.json
name = "builly-workspace"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"

# Unified Cloudflare Workers + Static Assets (Vite SPA + /api/* Worker)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Cloudflare Durable Object lock coordinator (account / org / project / site scopes)
[[durable_objects.bindings]]
name = "WORKSPACE_LOCK"
class_name = "WorkspaceLockDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceLockDO"]

# Optional R2 bucket for immutable public snapshots & published assets (zero secrets):
# [[r2_buckets]]
# binding = "PUBLIC_ARTIFACTS"
# bucket_name = "builly-public-artifacts"

# Cloudflare D1 Registry & Encrypted OAuth Vault
# Create with: npx wrangler d1 create builly_oauth_vault
# Then replace database_id below with your generated D1 UUID before deploying.
[[d1_databases]]
binding = "DB"
database_name = "builly"
database_id = "583c5b8a-e367-40f3-9403-ea03dcf25035"
migrations_dir = "worker/migrations"

[vars]
GOOGLE_WORKSPACE_SCOPES = "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly"

# Configure per environment in Cloudflare Dashboard -> Settings -> Variables and Secrets
# (or uncomment below if deploying directly via CLI):
# SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
# ALLOWED_FRONTEND_ORIGINS = "https://builly.indyshares.com,http://localhost:3000,http://localhost:8787"
# GOOGLE_OAUTH_REDIRECT_URI = "https://builly.indyshares.com/api/google/oauth/callback"

# Required Worker Secrets (set via `npx wrangler secret put <KEY>` or Cloudflare Dashboard — NEVER commit):
# - GOOGLE_OAUTH_CLIENT_ID
# - GOOGLE_OAUTH_CLIENT_SECRET
# - TOKEN_ENCRYPTION_KEY   (base64 32-byte key for AES-256-GCM)
# - SUPABASE_ANON_KEY      (optional; forwarded as apikey header when verifying Supabase JWT)
