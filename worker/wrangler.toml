#:schema ../node_modules/wrangler/config-schema.json
# NOT the production deployment config. Production deploys from the ROOT wrangler.toml
# (`npm run cf:deploy`) as Worker `builly-project`, which owns the D1/DO bindings and
# runtime vars. Setting OAuth secrets on this Worker will not fix the production app.
name = "builly-workspace-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "WORKSPACE_LOCK"
class_name = "WorkspaceLockDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceLockDO"]

[vars]
GOOGLE_WORKSPACE_SCOPES = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly"

# Configure in Cloudflare Dashboard or per environment:
# ALLOWED_FRONTEND_ORIGINS = "https://builly.me,http://localhost:3000"
# GOOGLE_OAUTH_REDIRECT_URI = "https://api.builly.me/api/google/oauth/callback"

# Required Worker Secrets (set via `wrangler secret put` — NEVER commit):
# - GOOGLE_OAUTH_CLIENT_ID
# - GOOGLE_OAUTH_CLIENT_SECRET
# - TOKEN_ENCRYPTION_KEY (base64 32-byte key for AES-256-GCM)

# Bind Cloudflare D1 database for encrypted OAuth vault & Workspace registry pointers:
# [[d1_databases]]
# binding = "DB"
# database_name = "builly_oauth_vault"
# database_id = "YOUR_D1_DATABASE_ID"
# migrations_dir = "migrations"

